<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Dynamic Table Rows</title>
	<style>
		:root {
			font-family: Arial, sans-serif;
			color: #1f2937;
			background: #f3f4f6;
		}

		* {
			box-sizing: border-box;
		}

		body {
			margin: 0;
			padding: 2rem 1rem;
		}

		main {
			width: min(100%, 52rem);
			margin: 0 auto;
			padding: 2rem;
			background: #ffffff;
			border: 1px solid #d1d5db;
			border-radius: 0.75rem;
			box-shadow: 0 1rem 2rem rgb(31 41 55 / 10%);
		}

		h1 {
			margin: 0 0 1.5rem;
			font-size: 1.6rem;
		}

		form {
			display: grid;
			grid-template-columns: repeat(3, 1fr) auto;
			gap: 0.75rem;
			align-items: end;
			margin-bottom: 2rem;
		}

		label {
			display: grid;
			gap: 0.4rem;
			font-size: 0.9rem;
			font-weight: 700;
		}

		input,
		select,
		button {
			min-height: 2.75rem;
			padding: 0.65rem 0.75rem;
			border: 1px solid #9ca3af;
			border-radius: 0.375rem;
			font: inherit;
		}

		button {
			border-color: #2563eb;
			color: #ffffff;
			background: #2563eb;
			cursor: pointer;
			font-weight: 700;
		}

		button:hover {
			background: #1d4ed8;
		}

		.table-wrapper {
			overflow-x: auto;
		}

		table {
			width: 100%;
			border-collapse: collapse;
		}

		th,
		td {
			padding: 0.8rem;
			border-bottom: 1px solid #e5e7eb;
			text-align: left;
		}

		th {
			color: #374151;
			background: #f9fafb;
			font-size: 0.85rem;
			text-transform: uppercase;
		}

		.delete-button {
			min-height: auto;
			padding: 0.4rem 0.6rem;
			border-color: #dc2626;
			background: #dc2626;
			font-size: 0.85rem;
		}

		.delete-button:hover {
			background: #b91c1c;
		}

		#empty-message {
			color: #6b7280;
			text-align: center;
		}

		@media (max-width: 700px) {
			main {
				padding: 1.25rem;
			}

			form {
				grid-template-columns: 1fr;
			}
		}
	</style>
</head>
<body>
	<main>
		<h1>Team members</h1>

		<form id="row-form">
			<label>
				Name
				<input id="name" name="name" type="text" required>
			</label>
			<label>
				Email
				<input id="email" name="email" type="email" required>
			</label>
			<label>
				Role
				<select id="role" name="role" required>
					<option value="">Select a role</option>
					<option>Designer</option>
					<option>Developer</option>
					<option>Manager</option>
				</select>
			</label>
			<button type="submit">Add row</button>
		</form>

		<div class="table-wrapper">
			<table>
				<thead>
					<tr>
						<th>Name</th>
						<th>Email</th>
						<th>Role</th>
						<th>Action</th>
					</tr>
				</thead>
				<tbody id="table-body">
					<tr id="empty-message">
						<td colspan="4">No team members added yet.</td>
					</tr>
				</tbody>
			</table>
		</div>
	</main>

	<script>
		const rowForm = document.querySelector('#row-form');
		const tableBody = document.querySelector('#table-body');
		const emptyMessage = document.querySelector('#empty-message');

		rowForm.addEventListener('submit', (event) => {
			event.preventDefault();

			const formData = new FormData(rowForm);
			const row = document.createElement('tr');
			const nameCell = document.createElement('td');
			const emailCell = document.createElement('td');
			const roleCell = document.createElement('td');
			const actionCell = document.createElement('td');
			const deleteButton = document.createElement('button');

			nameCell.textContent = formData.get('name');
			emailCell.textContent = formData.get('email');
			roleCell.textContent = formData.get('role');
			deleteButton.type = 'button';
			deleteButton.className = 'delete-button';
			deleteButton.textContent = 'Delete';
			deleteButton.addEventListener('click', () => {
				row.remove();

				if (tableBody.children.length === 0) {
					tableBody.append(emptyMessage);
				}
			});

			actionCell.append(deleteButton);
			row.append(nameCell, emailCell, roleCell, actionCell);
			emptyMessage.remove();
			tableBody.append(row);
			rowForm.reset();
		});
	</script>
</body>
</html>
