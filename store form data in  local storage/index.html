<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Saved Form Draft</title>
	<style>
		:root {
			font-family: Arial, sans-serif;
			color: #1f2937;
			background: #ecfdf5;
		}

		* {
			box-sizing: border-box;
		}

		body {
			display: grid;
			min-height: 100vh;
			margin: 0;
			place-items: center;
			padding: 1rem;
		}

		form {
			width: min(100%, 30rem);
			padding: 2rem;
			background: #ffffff;
			border: 1px solid #a7f3d0;
			border-radius: 0.75rem;
			box-shadow: 0 1rem 2rem rgb(6 78 59 / 12%);
		}

		h1 {
			margin: 0 0 0.5rem;
			font-size: 1.6rem;
		}

		.intro {
			margin: 0 0 1.5rem;
			color: #4b5563;
		}

		label {
			display: grid;
			gap: 0.4rem;
			margin-top: 1rem;
			font-weight: 700;
		}

		input,
		textarea,
		button {
			padding: 0.75rem;
			border: 1px solid #9ca3af;
			border-radius: 0.375rem;
			font: inherit;
		}

		textarea {
			min-height: 8rem;
			resize: vertical;
		}

		.actions {
			display: flex;
			gap: 0.75rem;
			margin-top: 1.5rem;
		}

		button {
			border-color: #047857;
			color: #ffffff;
			background: #047857;
			cursor: pointer;
			font-weight: 700;
		}

		button:hover {
			background: #065f46;
		}

		button[type="button"] {
			border-color: #d1d5db;
			color: #374151;
			background: #ffffff;
		}

		button[type="button"]:hover {
			background: #f3f4f6;
		}

		#status {
			min-height: 1.25rem;
			margin: 1rem 0 0;
			color: #047857;
			font-size: 0.9rem;
		}
	</style>
</head>
<body>
	<form id="profile-form">
		<h1>Your profile</h1>
		<p class="intro">Your unfinished form data is saved automatically in this browser.</p>

		<label>
			Name
			<input name="name" type="text" autocomplete="name" required>
		</label>

		<label>
			Email
			<input name="email" type="email" autocomplete="email" required>
		</label>

		<label>
			Notes
			<textarea name="notes" placeholder="Add any helpful details..."></textarea>
		</label>

		<div class="actions">
			<button type="submit">Submit</button>
			<button id="clear-button" type="button">Clear saved data</button>
		</div>
		<p id="status" role="status" aria-live="polite"></p>
	</form>

	<script>
		function createPersistentForm(form, storageKey) {
			const fields = [...form.elements].filter((field) => field.name);

			function save() {
				const values = Object.fromEntries(
					fields.map((field) => [field.name, field.value])
				);
				localStorage.setItem(storageKey, JSON.stringify(values));
			}

			function restore() {
				const savedValues = localStorage.getItem(storageKey);
				if (!savedValues) return false;

				const values = JSON.parse(savedValues);
				fields.forEach((field) => {
					if (Object.hasOwn(values, field.name)) {
						field.value = values[field.name];
					}
				});
				return true;
			}

			function clear() {
				localStorage.removeItem(storageKey);
				form.reset();
			}

			fields.forEach((field) => field.addEventListener('input', save));

			return { save, restore, clear };
		}

		const form = document.querySelector('#profile-form');
		const status = document.querySelector('#status');
		const persistentForm = createPersistentForm(form, 'profile-form-draft');

		if (persistentForm.restore()) {
			status.textContent = 'Saved draft restored.';
		}

		form.addEventListener('submit', (event) => {
			event.preventDefault();
			persistentForm.save();
			status.textContent = 'Your form data was saved.';
		});

		document.querySelector('#clear-button').addEventListener('click', () => {
			persistentForm.clear();
			status.textContent = 'Saved data cleared.';
		});
	</script>
</body>
</html>
